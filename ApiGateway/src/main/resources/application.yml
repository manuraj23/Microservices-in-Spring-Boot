server:
  port: 8084

spring:
  application:
    name: API-GATEWAY

  config:
    import: optional:configserver:http://localhost:8085

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        - id: HotelService
          uri: lb://HOTELSERVICE
          predicates:
            - Path=/HotelService/**

        - id: UserService
          uri: lb://USERSERVICE
          predicates:
            - Path=/UserService/**

        - id: RatingService
          uri: lb://RATINGSERVICE
          predicates:
            - Path=/RatingService/**

        - id: users-friendly
          uri: lb://USERSERVICE
          predicates:
            - Path=/users/**
          filters:
            - "RewritePath=/users/(?<segment>.*), /UserService/${segment}"

#eureka:
#  instance:
#    prefer-ip-address: true
#
#  client:
#    register-with-eureka: true
#    fetch-registry: true
#    service-url:
#      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway,env,metrics,loggers"
  endpoint:
    gateway:
      enabled: true
