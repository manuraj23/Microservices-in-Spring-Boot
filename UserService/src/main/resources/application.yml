spring:
  application:
    name: UserService

  datasource:
    url: jdbc:postgresql://localhost:5432/UserService
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  config:
    import: optional:configserver:http://localhost:8085

