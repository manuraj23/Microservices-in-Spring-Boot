#    register-with-eureka: true
#    service-url:
#      defaultZone: http://localhost:8761/eureka/

server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

